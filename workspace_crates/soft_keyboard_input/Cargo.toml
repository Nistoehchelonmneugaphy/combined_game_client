[package]
name = "soft_keyboard_input"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web = { workspace = true }
web-sys = { version = "0.3.103", features = [
    "Window",
    "Document",
    "HtmlInputElement",
    "FocusOptions",
    "HtmlElement",
    "Element",
    "InputEvent",
    "CompositionEvent",
    "DomTokenList",
] }
