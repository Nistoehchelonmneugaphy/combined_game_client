[package]
name = "game_server_client"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22.1"
tokio = { version = "1.52.3", default-features = false, features = [ "sync", "macros" ] }
gloo-net = { version = "0.7.0", features = ["websocket", "json"] }
wasm-bindgen-futures = "0.4.75"
web_mobile_input = { workspace = true }
web = { workspace = true }


[target.'cfg(target_os = "android")'.dependencies]
android_mobile_input = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { version = "0.29.0", features = [ "rustls-tls-webpki-roots" ] }
tokio = { workspace = true }

[dependencies]


bevy = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
ehttp = { workspace = true }
shared = { workspace = true }
auth_system_structs = { workspace = true }
game_server_structs = { workspace = true }
bevy_mod_reqwest = { workspace = true }
futures-util = { version = "0.3.32", features = ["sink"]}
http = "1.4.2"
url = "2.5.8"
tracing = { workspace = true }
