[package]
name = "game_server_client"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.23.0"
tokio = { version = "1.53.1", default-features = false, features = [ "sync", "macros" ] }
gloo-net = { version = "0.7.0", features = ["websocket", "json"] }
wasm-bindgen-futures = "0.4.76"
web = { workspace = true }



[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dependencies]


bevy = { workspace = true }
match_client = { workspace = true }
soft_keyboard_input = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
ehttp = { workspace = true }
shared = { workspace = true }
auth_system_structs = { workspace = true }
game_server_public_api = { workspace = true }
bevy_mod_reqwest = { workspace = true }
futures-util = { version = "0.3.33", features = ["sink"]}
http = "1.4.2"
url = "2.5.8"
tracing = { workspace = true }
