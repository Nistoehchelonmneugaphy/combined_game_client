[package]
name = "main"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web"] }
web = { workspace = true }
web_mobile_input = { workspace = true }

[lib]
name = "main"
crate-type = ["lib", "cdylib"]

[dependencies]
dotenvy = { workspace = true }
bevy = { workspace = true, features = ["android-game-activity", "android_shared_stdcxx"] }
launcher = { workspace = true }
startup = { workspace = true }
shared = { workspace = true }
