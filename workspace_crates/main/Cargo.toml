[package]
name = "main"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
bevy = { workspace = true, features = ["web"] }
web-sys = { version = "0.3.99", features = [
    "Window",
    "Document",
    "HtmlInputElement",
    "Element",
    "InputEvent",
    "CompositionEvent"
] }

[dependencies]
dotenvy = { workspace = true }
bevy = { workspace = true }
launcher = { workspace = true }
startup = { workspace = true }
shared = { workspace = true }
