[package]
name = "main"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web"] }
web = { workspace = true }
web_mobile_input = { workspace = true }
[target.'cfg(target_os = "android")'.dependencies]
android_mobile_input = { workspace = true }

[lib]
name = "client_app_rust_lib"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "client_app_rust_bin"
path = "src/main.rs"


[dependencies]
dotenvy = { workspace = true }
bevy = { workspace = true, features = ["android-game-activity"] }
launcher = { workspace = true }
startup = { workspace = true }
game_server_client = { workspace = true }
shared = { workspace = true }
soft_keyboard_input = { workspace = true  }
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
rustls = { workspace = true, features = [ "aws-lc-rs", "prefer-post-quantum", "logging", "std", "tls12" ] }