[package]
name = "web_mobile_input"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true }
web = { workspace = true }
web-sys = { version = "0.3.99", features = [
    "Window",
    "Document",
    "HtmlInputElement",
    "FocusOptions",
    "HtmlElement",
    "Element",
    "InputEvent",
    "CompositionEvent",
    "DomTokenList",
] }