[package]
name = "web_mobile_input"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.99", features = [
    "Window",
    "Document",
    "HtmlInputElement",
    "Element",
    "InputEvent",
    "CompositionEvent"
] }