[workspace]
resolver = "3"
members = ["workspace_crates/*"]


[profile.dev]
strip = "symbols"
opt-level = 1
debug = false

[workspace.dependencies]
rustls = { version = "0.23.41", default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
ehttp = "0.7.1"
bevy_mod_reqwest = { git = "ssh://git@github.com/Aeroel/bevy_mod_reqwest.git", features = [ "json", "rustls-tls", "log" ] }
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
launcher = { path = "workspace_crates/launcher" }
game_server_client = { path = "workspace_crates/game_server_client" }
game_server_structs = { git = "ssh://git@github.com/Aeroel/game_server.git" }
web_mobile_input = { path = "workspace_crates/web_mobile_input" }
android_mobile_input = { path = "workspace_crates/android_mobile_input" }
web = { path = "workspace_crates/web" }
startup = { path = "workspace_crates/startup" }
shared = { path = "workspace_crates/shared" }
auth_system_structs = { git = "ssh://git@github.com/Aeroel/auth_system.git" }

bevy = { version = "0.18", features = [
    "free_camera","debug", "serialize", "mp3",
    ] }
bevy_renet = "4.0.1"
bevy_rapier3d = "0.34.0"
config = "0.15.24"
dotenvy = "0.15.7"
envy = "0.4.2"
git-version = "0.3.9"
rand = "0.10.1"
anyhow = "1.0.102"
tracing = "0.1.44"

# test of another way to include crates
[workspace.dependencies.uuid]
version = "1.23.3"
features = [
    "v4",
]
